name: 資料源連線診斷

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests yfinance
      - name: 測試各資料源
        shell: python
        run: |
          import time, datetime as dt, requests
          H = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
               'Referer': 'https://fubon-ebrokerdj.fbs.com.tw/'}
          d = dt.date.today() - dt.timedelta(days=1)
          while d.weekday() >= 5: d -= dt.timedelta(days=1)
          ds, dy, dq = f'{d.year}-{d.month}-{d.day}', d.strftime('%Y%m%d'), d.strftime('%Y/%m/%d')
          tests = {
            '富邦分點 zgb0': f'https://fubon-ebrokerdj.fbs.com.tw/z/zg/zgb/zgb0.djhtm?a=9800&b=0039003800310042&c=E&e={ds}&f={ds}',
            '富邦個股 zco': f'https://fubon-ebrokerdj.fbs.com.tw/z/zc/zco/zco.djhtm?a=2330&e={ds}&f={ds}',
            'TWSE T86': f'https://www.twse.com.tw/rwd/zh/fund/T86?date={dy}&selectType=ALLBUT0999&response=json',
            'TWSE 融資': f'https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date={dy}&selectType=ALL&response=json',
            'TPEx 法人': f'https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=AL&date={dq}&response=json',
            'TWSE ISIN': 'https://isin.twse.com.tw/isin/C_public.jsp?strMode=2',
          }
          for name, url in tests.items():
              t0 = time.time()
              try:
                  r = requests.get(url, headers=H, timeout=25)
                  txt = r.content.decode('cp950' if 'fbs' in url or 'isin' in url else 'utf-8', errors='ignore')
                  hint = '資料日期' if '資料日期' in txt else ('stat' if '"stat"' in txt else ('tables' if '"tables"' in txt else ''))
                  print(f'{name:<12} HTTP {r.status_code}  {len(r.content):>8} bytes  {time.time() - t0:5.1f}s  標記:{hint or "無"}')
              except Exception as e:
                  print(f'{name:<12} 失敗 {type(e).__name__}: {str(e)[:120]}  {time.time() - t0:5.1f}s')
          # zco（個股主力進出）頁面結構，供解析器比對
          r = requests.get(tests['富邦個股 zco'], headers=H, timeout=25)
          html = r.content.decode('cp950', errors='ignore')
          import re as _re
          txt = _re.sub(r'\s+', ' ', _re.sub(r'<[^>]+>', ' ', html)).replace('&nbsp;', ' ')
          for kw in ('家數', '合計', '買超', '賣超', '資料日期', '區間'):
              for m in list(_re.finditer(kw, txt))[:3]:
                  print(f'[zco:{kw}]', txt[max(0, m.start() - 80):m.end() + 120])
          i = html.find('家數')
          print('[zco:html]', html[max(0, i - 600):i + 600].replace('\n', ' ') if i >= 0 else html[:1500].replace('\n', ' '))
          import yfinance as yf
          t0 = time.time(); h = yf.download(['2330.TW', '6488.TWO'], period='5d', progress=False)
          print(f'yfinance     {h.shape}  {time.time() - t0:5.1f}s')
