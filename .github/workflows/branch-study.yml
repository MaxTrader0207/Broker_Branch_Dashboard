name: 單一分點研究

on:
  workflow_dispatch:
    inputs:
      branches:
        description: '分點：名稱（如 凱基-台北）或 名稱=a:b（如 凱基-台北=9200:9268）；多個用分號隔開'
        required: true
        default: '凱基-台北=9200:9268'
      slug:
        description: '報表資料夾名稱（小寫英數與連字號），結果存到 studies/<名稱>/'
        required: true
        default: 'kgi-taipei'

permissions:
  contents: write   # 把報表提交到 studies/

concurrency:
  group: branch-study-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BROKER_RUN_MODE: ci
      BROKER_STUDY: '1'
      BROKER_BRANCHES: ${{ inputs.branches }}
      BROKER_OUTPUT_DIR: ${{ github.workspace }}/out
      STUDY_SLUG: ${{ inputs.slug }}
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 檢查資料夾名稱
        run: |
          if ! [[ "$STUDY_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,40}$ ]]; then echo "資料夾名稱只能用小寫英數與連字號：$STUDY_SLUG"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 還原資料快取（先找這個研究自己的，沒有就借用每日排程的股價／法人／融資快取）
        uses: actions/cache/restore@v4
        with:
          path: out/_cache
          key: study-cache-${{ inputs.slug }}-${{ github.run_id }}
          restore-keys: |
            study-cache-${{ inputs.slug }}-
            broker-cache-

      - name: 執行 notebook（研究模式：不寫訊號台帳）
        run: |
          mkdir -p out
          papermill broker_dashboard.ipynb out/executed.ipynb \
            --log-output --no-progress-bar --request-save-on-cell-execute -k python3

      - name: 儲存這個研究的快取（重跑時不必再抓一次）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: out/_cache
          key: study-cache-${{ inputs.slug }}-${{ github.run_id }}

      - name: 保留執行紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-${{ inputs.slug }}
          path: |
            out/executed.ipynb
            out/*.html
            out/build_info.json
          retention-days: 30
          if-no-files-found: ignore

      - name: 把報表提交到 studies/
        run: |
          rm -rf "studies/$STUDY_SLUG"
          mkdir -p "studies/$STUDY_SLUG"
          cp out/*.html out/build_info.json "studies/$STUDY_SLUG/"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add studies
          if git diff --cached --quiet; then echo "報表無變動"; exit 0; fi
          git commit -m "study: $STUDY_SLUG $(date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
